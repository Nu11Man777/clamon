[project]
name = "scraper"
version = "0.1.0"
description = "Descarga la pagina de un sitio registrado y devuelve su texto"
readme = "README.md"
authors = [
    { name = "JohannTF", email = "trejofloresjohanndaniel@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.1",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
scraper = "scraper.main:ejecutar"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S104"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "E501"]
